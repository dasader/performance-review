services:
  db:
    image: postgres:16-alpine
    # 호스트 재부팅 후 스택이 자동으로 돌아오게 한다. 이게 없어 2026-08-08 재부팅
    # 이후 3개 컨테이너가 이틀간 내려가 있었고, 그 사이 8/10 월간 자동 분석이
    # 통째로 건너뛰어졌다(scheduled_runs에 2026-08 행 없음). 잡 루프가 스케줄
    # 시각에 살아 있는 것이 전제인 서비스라 정지가 곧 기능 상실이다.
    # `no`가 아니라 `unless-stopped`인 이유: 관리자가 의도적으로 내린 상태
    # (docker compose stop)는 재부팅 후에도 유지돼야 한다.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perfrev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perfrev}
      POSTGRES_DB: ${POSTGRES_DB:-perfrev}
    ports:
      # 루프백에만 바인딩한다. 앞서 0.0.0.0이었고 POSTGRES_PASSWORD가 .env에 없어
      # compose 기본값(perfrev)이 그대로 쓰였다 — 호스트가 외부에서 닿는 순간 DB 전체다.
      # 로컬 psql은 그대로 되고(localhost:5403), 컨테이너 간 통신은 이 매핑과 무관하다.
      - "127.0.0.1:${DB_PORT:-5403}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perfrev}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      # 이 매핑은 디버깅용일 뿐이다 — 화면은 web(nginx)이 도커 네트워크로 api:8000에
      # 프록시한다. 0.0.0.0에 두면 nginx를 우회해 관리자 API에 직접 닿고,
      # X-Forwarded-For를 손볼 프록시조차 없어 방문자 해시를 마음대로 만들 수 있다.
      - "127.0.0.1:${API_PORT:-8003}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8103}:80"
    depends_on:
      - api

volumes:
  pgdata:
