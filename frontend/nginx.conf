# 이 파일은 /etc/nginx/conf.d/default.conf로 들어가므로 server 블록 밖은 http 컨텍스트다
# — limit_req_zone은 여기에만 놓을 수 있다.
#
# 공개 API는 인증도 과금도 없지만 값이 싸지 않다: /api/fields/{id}/subfield-reports 하나가
# 세부기술 보고서 전문(건당 12KB 규모)을 수십 건 모아 각주 치환까지 돌려 내려준다.
# 20r/s는 화면 폴링(4~5초 주기)보다 두 자릿수 위라 정상 사용에는 닿지 않는다.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 응답 헤더에서 nginx 버전을 뺀다.
  server_tokens off;

  # script-src를 'self'로 못 박는 것이 이 CSP의 본체다. 보고서 본문은 LLM이 만든
  # 마크다운이고 그 입력에는 외부 논문 초록·로드맵 원문이 그대로 들어간다 —
  # react-markdown이 raw HTML을 파싱하지 않아(rehype-raw 미사용) 이미 막혀 있지만,
  # 렌더 경로를 누가 바꿨을 때 조용히 뚫리지 않도록 두 번째 선을 둔다.
  # style-src의 'unsafe-inline'은 React가 style 속성을 직접 쓰기 때문에 필요하다
  # (스타일 인젝션은 script 실행과 위험도가 다르다).
  # 폰트 두 출처는 index.html이 실제로 부르는 곳이다 — 빼면 화면이 기본 폰트로 떨어진다.
  # frame-ancestors가 X-Frame-Options를 대체하므로 그 헤더는 따로 두지 않는다.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=api burst=40 nodelay;

    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    # $proxy_add_x_forwarded_for가 아니라 $remote_addr다. 전자는 **클라이언트가 보낸
    # 값 뒤에** 실제 IP를 덧붙이는데, main.py::_client_ip는 첫 값을 쓴다 — 즉 방문자
    # 해시의 입력을 요청자가 직접 정할 수 있어 순방문자 수를 임의로 부풀릴 수 있었다.
    # 여기서 통째로 덮어써 요청자가 넣은 값을 버린다.
    # (이 nginx 앞에 또 다른 리버스 프록시를 둔다면 그때는 그 프록시의 IP가 들어오므로,
    #  신뢰하는 프록시 IP만 통과시키는 realip 모듈로 바꿔야 한다.)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
